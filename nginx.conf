server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the converter backend service.
    location /convert {
        proxy_pass http://converter:8000;
        proxy_set_header Host $host;
    }
    location /health {
        proxy_pass http://converter:8000;
        proxy_set_header Host $host;
    }
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the converter backend service.
    # Use Docker's embedded DNS + a variable so nginx resolves `converter`
    # lazily at request time. The container then starts even when the backend
    # is absent (standalone run) instead of failing at config load.
    location /convert {
        resolver 127.0.0.11 ipv6=off valid=10s;
        set $converter_backend converter:8000;
        proxy_pass http://$converter_backend;
        proxy_set_header Host $host;
    }
    location /health {
        resolver 127.0.0.11 ipv6=off valid=10s;
        set $converter_backend converter:8000;
        proxy_pass http://$converter_backend;
        proxy_set_header Host $host;
    }
}
